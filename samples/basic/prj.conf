# Enable Serial Terminal module
CONFIG_SERIAL_TERMINAL=y

# Console support
CONFIG_CONSOLE=y
CONFIG_CONSOLE_GETCHAR=y
CONFIG_UART_CONSOLE=y

# Standard output
CONFIG_PRINTK=y
CONFIG_EARLY_CONSOLE=y

# C library
CONFIG_NEWLIB_LIBC=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048

# Disable shell (we're using serial_prompt)
CONFIG_SHELL=n